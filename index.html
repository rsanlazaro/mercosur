<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MERCOSUR — Cámara de Comercio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="icon" type="image/x-icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & base ────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:      #0C1F3F;
      --gold:      #A8892A;
      --gold-l:    #C4A94E;
      --gold-pale: #D4B96A;
      --text-mid:  #3D4460;
      --text-lt:   #6B7280;
      --text-dark: #1A1A2E;
      --divider:   #E5E7EB;
      --white:     #FFFFFF;
    }

    html, body {
      height: 100%;
      font-family: "Lato", "Liberation Sans", Arial, sans-serif;
      background: var(--white);
      color: var(--text-dark);
    }

    /* ── Layout: full-height flex column ────── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ─────────────────────────────── */
    header {
      background: var(--navy);
      border-bottom: 2.5px solid var(--gold);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-label {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .header-label span {
      font-size: 9px;
      font-weight: 300;
      letter-spacing: 2.5px;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
    }

    /* ── LANGUAGE TOGGLE ─────────────────────── */
    .lang-toggle {
      display: flex;
      border: 0.8px solid rgba(212,185,106,0.55);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
    }

    .lang-btn {
      width: 52px;
      height: 30px;
      font-family: "Lato", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      background: transparent;
      color: rgba(255,255,255,0.7);
    }

    .lang-btn.active {
      background: var(--gold);
      color: var(--navy);
    }

    .lang-btn:hover:not(.active) {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    /* ── MAIN CONTENT ────────────────────────── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── LOGO SECTION ────────────────────────── */
    .logo-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 52px 24px 36px;
      background: var(--white);
    }

    .logo-section img {
      width: clamp(180px, 25vw, 300px);
      height: auto;
      display: block;
    }

    /* ── WORDMARK ────────────────────────────── */
    .wordmark {
      margin-top: 24px;
      text-align: center;
    }

    .wordmark h1 {
      font-family: "Libre Baskerville", "Liberation Serif", Georgia, serif;
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 700;
      color: var(--navy);
      letter-spacing: 1px;
    }

    .wordmark-rule {
      width: 90px;
      height: 1.5px;
      background: var(--gold);
      margin: 10px auto 10px;
    }

    .wordmark p {
      font-size: clamp(8px, 1.2vw, 10px);
      font-weight: 300;
      letter-spacing: 3px;
      color: var(--text-mid);
      text-transform: uppercase;
    }

    /* ── SEPARATOR ───────────────────────────── */
    .sep {
      width: calc(100% - 80px);
      max-width: 900px;
      height: 1px;
      background: var(--divider);
      margin: 0 auto;
    }

    /* ── CONTENT SECTION ─────────────────────── */
    .content-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 52px 24px 48px;
      text-align: center;
    }

    .aviso-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--gold);
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .headline {
      font-family: "Libre Baskerville", "Liberation Serif", Georgia, serif;
      font-size: clamp(30px, 4vw, 60px);
      font-weight: 700;
      color: var(--navy);
      line-height: 1.1;
    }

    .headline-rule {
      width: 110px;
      height: 1px;
      background: var(--gold);
      margin: 18px auto 28px;
    }

    .body-text {
      max-width: 480px;
      line-height: 1.7;
    }

    .body-text p:first-child {
      font-size: clamp(13px, 1.6vw, 15px);
      font-weight: 400;
      color: var(--text-mid);
    }

    .body-text p:last-child {
      font-size: clamp(12.5px, 1.5vw, 14.5px);
      font-weight: 300;
      color: var(--text-mid);
      margin-top: 6px;
    }

    /* ── CONTACT SECTION ─────────────────────── */
    .contact-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 24px 52px;
      text-align: center;
    }

    .contact-rule-top {
      width: 160px;
      height: 1px;
      background: var(--gold);
      opacity: 0.45;
      margin-bottom: 16px;
    }

    .contact-label {
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 3.5px;
      color: var(--text-lt);
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .contact-intro {
      font-size: clamp(12.5px, 1.5vw, 14px);
      font-weight: 300;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .contact-email {
      font-size: clamp(13.5px, 1.8vw, 15.5px);
      font-weight: 700;
      color: var(--navy);
      text-decoration: none;
      border-bottom: 1px solid rgba(12,31,63,0.2);
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }

    .contact-email:hover {
      color: var(--gold);
      border-color: var(--gold);
    }

    .contact-rule-bottom {
      width: calc(100% - 80px);
      max-width: 900px;
      height: 1px;
      background: var(--divider);
      margin: 40px auto 0;
    }

    /* ── FOOTER ──────────────────────────────── */
    footer {
      background: var(--navy);
      border-top: 1.5px solid var(--gold);
      padding: 16px 32px;
      text-align: center;
    }

    footer p {
      font-size: 9px;
      font-weight: 300;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.5px;
    }

    /* ── TRANSITIONS ─────────────────────────── */
    [data-i18n] {
      transition: opacity 0.22s ease;
    }

    .lang-fade {
      opacity: 0;
    }

    /* ── RESPONSIVE ──────────────────────────── */
    @media (max-width: 600px) {
      header { padding: 0 20px; height: 58px; }
      .logo-section { padding: 36px 20px 28px; }
      .content-section { padding: 36px 20px 36px; }
      .contact-section { padding: 0 20px 36px; }
      footer { padding: 14px 20px; }
      .sep { width: calc(100% - 40px); }
    }

    @media (prefers-reduced-motion: reduce) {
      [data-i18n] { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- ── HEADER ── -->
    <header>
      <div class="header-label">
        <span data-i18n="header-line1">C Á M A R A &nbsp; D E &nbsp; C O M E R C I O</span>
        <span>M E R C O S U R</span>
      </div>
      <div class="lang-toggle" role="group" aria-label="Seleccionar idioma">
        <button class="lang-btn active" id="btn-es" onclick="setLang('es')" aria-pressed="true">ES</button>
        <button class="lang-btn"        id="btn-pt" onclick="setLang('pt')" aria-pressed="false">PT</button>
      </div>
    </header>

    <!-- ── MAIN ── -->
    <main>

      <!-- Logo section -->
      <section class="logo-section">
        <img src="assets/logo.png" alt="MERCOSUR Cámara de Comercio logo"/>
      </section>

      <div class="sep"></div>

      <!-- Coming soon block -->
      <section class="content-section">
        <p class="aviso-label" aria-hidden="true">— &nbsp; A V I S O &nbsp; —</p>
        <h2 class="headline" data-i18n="headline">Próximamente</h2>
        <div class="headline-rule"></div>
        <div class="body-text">
          <p data-i18n="body1">Estamos reestructurando nuestra página.</p>
          <p data-i18n="body2">En breve volvemos con más información.</p>
        </div>
      </section>

      <!-- Contact section -->
      <section class="contact-section">
        <div class="contact-rule-top"></div>
        <p class="contact-label" data-i18n="contact-label">C O N T A C T O</p>
        <p class="contact-intro" data-i18n="contact-intro">Pueden siempre contactarnos a:</p>
        <a class="contact-email" href="mailto:info@camaracomerciomercosur.org">
          info@camaracomerciomercosur.org
        </a>
        <div class="contact-rule-bottom"></div>
      </section>

    </main>

    <!-- ── FOOTER ── -->
    <footer>
      <p data-i18n="footer">Cámara de Comercio MERCOSUR</p>
    </footer>

  </div>

  <script>
    const translations = {
      es: {
        "header-line1":   "C Á M A R A &nbsp; D E &nbsp; C O M E R C I O",
        "subtitle":       "C Á M A R A &nbsp; D E &nbsp; C O M E R C I O &nbsp; D E &nbsp; A M É R I C A &nbsp; D E L &nbsp; S U R",
        "headline":       "Próximamente",
        "body1":          "Estamos reestructurando nuestra página.",
        "body2":          "En breve volvemos con más información.",
        "contact-label":  "C O N T A C T O",
        "contact-intro":  "Pueden contactarnos a:",
        "footer":         "Cámara de Comercio MERCOSUR"
      },
      pt: {
        "header-line1":   "C Â M A R A &nbsp; D E &nbsp; C O M É R C I O",
        "subtitle":       "C Â M A R A &nbsp; D E &nbsp; C O M É R C I O &nbsp; D A &nbsp; A M É R I C A &nbsp; D O &nbsp; S U L",
        "headline":       "Em Breve",
        "body1":          "Estamos reestruturando nossa página.",
        "body2":          "Em breve, retornaremos com mais informações.",
        "contact-label":  "C O N T A T O",
        "contact-intro":  "Entrem em contato conosco pelo e-mail:",
        "footer":         "Câmara de Comércio MERCOSUR"
      }
    };

    let currentLang = "es";

    function setLang(lang) {
      if (lang === currentLang) return;
      currentLang = lang;

      // Update html lang attribute
      document.documentElement.lang = lang;

      // Toggle button states
      document.getElementById("btn-es").classList.toggle("active", lang === "es");
      document.getElementById("btn-es").setAttribute("aria-pressed", lang === "es");
      document.getElementById("btn-pt").classList.toggle("active", lang === "pt");
      document.getElementById("btn-pt").setAttribute("aria-pressed", lang === "pt");

      // Fade out, swap, fade in
      const els = document.querySelectorAll("[data-i18n]");
      els.forEach(el => el.classList.add("lang-fade"));

      setTimeout(() => {
        els.forEach(el => {
          const key = el.getAttribute("data-i18n");
          if (translations[lang][key] !== undefined) {
            el.innerHTML = translations[lang][key];
          }
        });
        els.forEach(el => el.classList.remove("lang-fade"));
      }, 220);
    }
  </script>
</body>
</html>
