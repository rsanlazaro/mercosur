<title>Enlaces — Cámara de Comercio Mercosur</title>

<link rel="icon" href="assets/images/logo-circle.png">
<style>
  :root{
    --navy-title:#0a2263;
    --blue-btn:#2e52a9;
    --blue-btn-hover:#26428a;
    --ink-soft:#4a4a52;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color:#050b1a;
    background-image:url('assets/images/links-bg.jpg');
    background-repeat:no-repeat;
    background-size:cover;
    background-position:center;
    display:flex; align-items:center; justify-content:center;
    padding: 40px 20px;
  }
  .links-card{
    background:#fff; width:100%; max-width:480px;
    border-radius:14px; box-shadow:0 24px 60px rgba(0,0,0,.45);
    padding: 36px 36px 34px; text-align:center;
  }
  .links-logo{ width:140px; height:auto; margin:0 auto 16px; display:block; }
  .links-title{
    font-size:1.4rem; font-weight:800; color: var(--navy-title); margin: 0 0 8px;
    letter-spacing:.01em;
  }
  .links-tagline{
    font-size:.92rem; color: var(--ink-soft); line-height:1.45; margin: 0 0 24px;
  }
  .links-tagline strong{ color: var(--ink-soft); font-weight:700; }
  .links-list{ display:flex; flex-direction:column; gap:12px; }
  .link-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    background: var(--blue-btn); color:#fff; text-decoration:none;
    font-size:.92rem; font-weight:700; letter-spacing:.01em;
    padding: 14px 20px; border-radius:9px; width:100%;
    transition: background .18s ease, transform .18s ease;
  }
  .link-btn:hover{ background: var(--blue-btn-hover); transform: translateY(-1px); }
  .link-btn:active{ transform: translateY(0); }
  .link-btn svg{ width:20px; height:20px; flex-shrink:0; fill:#fff; }

  @media (min-width:600px){
    body{ padding: 40px; }
    .links-card{ max-width:560px; padding: 44px 48px 42px; }
    .links-logo{ width:150px; }
    .links-title{ font-size:1.55rem; }
    .links-tagline{ font-size:.98rem; margin-bottom:28px; }
    .link-btn{ font-size:.98rem; padding: 15px 22px; }
  }
  @media (max-width:420px){
    .links-card{ padding: 28px 22px 26px; }
    .link-btn{ padding: 13px 14px; font-size:.86rem; }
  }
</style>
